<body>
<header class="topbar" id="site-top"><div class="wrap"><nav class="nav" id="site-nav"></nav></div></header>
<script src="../assets/js/chrome.js"></script>
<div class="wrap">

  <div class="mast">
    <h1>Entrants</h1>
  </div>
  <div class="subtabs"><nav aria-label="Arena"><a href="runs.html"><i class="fa-solid fa-flag-checkered"></i>Matches</a><a href="games.html"><i class="fa-solid fa-gamepad"></i>Challenges</a><a href="entrants.html" class="on" aria-current="page"><i class="fa-solid fa-user-astronaut"></i>Entrants</a></nav></div>

  <div class="sech"><span>Entrants</span><span class="cnt" id="count"></span></div>
  <div class="roster" id="roster"></div>

  <!-- the ring: click a corner spot, then an entrant above -->
  <section class="arena" aria-label="The ring">
    <div class="plates">
      <div class="plate-n s0" id="plate0"></div>
      <div class="plates-mid">
        <span class="vs">VS</span>
        <button type="button" class="dice plate press" id="dice" title="Put a random pair in the ring"><i class="fa-solid fa-dice"></i></button>
      </div>
      <div class="plate-n s1" id="plate1"></div>
    </div>
    <div class="ring">
      <!-- assets/img/ring.webp: generated (gpt-image-2, "poster" brief), background cut
           to transparent; the two spots below are placed on its mat in % -->
      <img class="ring-art" src="../assets/img/ring.webp" width="1200" height="614" alt="" decoding="async">
      <div class="spot s0" id="spot0" role="button" tabindex="0" style="left:40%;top:52%"></div>
      <div class="spot s1" id="spot1" role="button" tabindex="0" style="left:60%;top:52%"></div>
    </div>
  </section>
  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="sech" id="ghead"><span>Matches</span></div>
  <div id="games"></div>
  <nav class="pager" id="pager" aria-label="Pages"></nav>

</div>
<footer class="footer" id="site-footer"></footer>
<script type="module" src="../assets/js/entrants.js"></script>
